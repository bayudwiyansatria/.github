name: "Git Tag"
description: "Setup Git Tag"
inputs:
  #---------------------------------------------------------------------------------------------------------------------
  # Usage
  #---------------------------------------------------------------------------------------------------------------------
  tag:
    description: "Git Tag"
    required: true
  #---------------------------------------------------------------------------------------------------------------------
  # Common
  #---------------------------------------------------------------------------------------------------------------------
  # No Common
  #---------------------------------------------------------------------------------------------------------------------
  # Features
  #---------------------------------------------------------------------------------------------------------------------
  # No Features
  #---------------------------------------------------------------------------------------------------------------------
  # Platform
  #---------------------------------------------------------------------------------------------------------------------
  # No Platform
  #---------------------------------------------------------------------------------------------------------------------
  # Registry
  #---------------------------------------------------------------------------------------------------------------------
  git-token:
    description: "Git Token"
    required: true
  #---------------------------------------------------------------------------------------------------------------------
  # Artifact
  #---------------------------------------------------------------------------------------------------------------------
  # No Artifact
  #---------------------------------------------------------------------------------------------------------------------
outputs:
  #---------------------------------------------------------------------------------------------------------------------
  # Usage
  #---------------------------------------------------------------------------------------------------------------------
  tag:
    description: "Git Tag"
    value: ${{ steps.git-tag.outputs.git-tag }}
runs:
  using: "composite"
  steps:
  #---------------------------------------------------------------------------------------------------------------------
  # Setup Git
  #---------------------------------------------------------------------------------------------------------------------
  - name: Git Tag
    shell: bash
    working-directory: .
    run: git tag ${{ inputs.tag }}
  - name: Push Tag
    shell: bash
    working-directory: .
    run: git push origin ${{ inputs.tag }}
    env:
      GITHUB_TOKEN: ${{ inputs.git-token }}
  #---------------------------------------------------------------------------------------------------------------------
  # Set Output
  #---------------------------------------------------------------------------------------------------------------------
  - id: git-tag
    name: Git Tag
    shell: bash
    working-directory: .
    run: echo "git-tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
