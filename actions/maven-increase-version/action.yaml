name: "Maven Get Version"
description: "Maven Get Version"
inputs:
  #---------------------------------------------------------------------------------------------------------------------
  # Usage
  #---------------------------------------------------------------------------------------------------------------------
  # No Usage
  #---------------------------------------------------------------------------------------------------------------------
  # Common
  #---------------------------------------------------------------------------------------------------------------------
  # No Common
  #---------------------------------------------------------------------------------------------------------------------
  # Features
  #---------------------------------------------------------------------------------------------------------------------
  checkout:
    description: "Checkout Repository"
    required: false
    default: "true"
  configure-java:
    description: "Configure Java"
    required: false
    default: "true"
  #---------------------------------------------------------------------------------------------------------------------
  # Platform
  #---------------------------------------------------------------------------------------------------------------------
  java-version:
    description: "Java Version"
    required: false
    default: 17.0.10
  #---------------------------------------------------------------------------------------------------------------------
  # Registry
  #---------------------------------------------------------------------------------------------------------------------
  # No Registry
  #---------------------------------------------------------------------------------------------------------------------
  # Artifact
  #---------------------------------------------------------------------------------------------------------------------
  # No Artifact
  #---------------------------------------------------------------------------------------------------------------------
outputs:
  #---------------------------------------------------------------------------------------------------------------------
  # Version
  #---------------------------------------------------------------------------------------------------------------------
  version:
    description: "Maven Get Version"
    value: ${{ steps.versions.outputs.version }}
runs:
  using: "composite"
  steps:
  #---------------------------------------------------------------------------------------------------------------------
  # Prepare Repository
  #---------------------------------------------------------------------------------------------------------------------
  - if: ${{ inputs.checkout == 'true' }}
    name: Prepare
    uses: actions/checkout@v4
  #---------------------------------------------------------------------------------------------------------------------
  # Setup Platform
  #---------------------------------------------------------------------------------------------------------------------
  - if: ${{ inputs.checkout == 'true' }}
    name: Configure Java
    uses: bayudwiyansatria/.github/actions/configure-java@master
    with:
      java-version: ${{ inputs.java-version }}
  #---------------------------------------------------------------------------------------------------------------------
  # Increase Version
  #---------------------------------------------------------------------------------------------------------------------
  - name: Prepare Deployment
    id: prepare
    shell: bash
    working-directory: .
    run: >-
      mvn
      --no-transfer-progress
      build-helper:parse-version
      versions:set -DnewVersion=\${{ env.tag_name }}
      versions:commit
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
