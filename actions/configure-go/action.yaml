name: "Go Configure"
description: "Configure Go for build and test operations"
inputs:
  #---------------------------------------------------------------------------------------------------------------------
  # Usage
  #---------------------------------------------------------------------------------------------------------------------
  # No Usage
  #---------------------------------------------------------------------------------------------------------------------
  # Common
  #---------------------------------------------------------------------------------------------------------------------
  # No Common
  #---------------------------------------------------------------------------------------------------------------------
  # Features
  #---------------------------------------------------------------------------------------------------------------------
  cache:
    description: "Enable Go module and build caching"
    required: false
    default: "false"
  cache-dependency-path:
    description: "Repository-relative dependency files used for the cache key"
    required: false
    default: go.mod
  #---------------------------------------------------------------------------------------------------------------------
  # Platform
  #---------------------------------------------------------------------------------------------------------------------
  go-version:
    description: "Go version or version range; overrides go-version-file when set"
    required: false
    default: ""
  go-version-file:
    description: "Repository-relative path to the Go version file"
    required: false
    default: go.mod
  #---------------------------------------------------------------------------------------------------------------------
  # Registry
  #---------------------------------------------------------------------------------------------------------------------
  # No Registry
  #---------------------------------------------------------------------------------------------------------------------
  # Artifact
  #---------------------------------------------------------------------------------------------------------------------
  # No Artifact
  #---------------------------------------------------------------------------------------------------------------------
runs:
  using: "composite"
  steps:
  #---------------------------------------------------------------------------------------------------------------------
  # Setup Platform
  #---------------------------------------------------------------------------------------------------------------------
  - name: Set Up Go
    uses: actions/setup-go@v7
    with:
      go-version: ${{ inputs.go-version }}
      go-version-file: ${{ inputs.go-version-file }}
      cache: ${{ inputs.cache }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
