name: Build Go
on:
  workflow_call:
    inputs:
      #-----------------------------------------------------------------------------------------------------------------
      # Usage
      #-----------------------------------------------------------------------------------------------------------------
      GO_COMMAND:
        type: string
        required: false
        default: go build ./...
      #-----------------------------------------------------------------------------------------------------------------
      # Common
      #-----------------------------------------------------------------------------------------------------------------
      WORKING_DIR:
        type: string
        required: false
        default: .
      #-----------------------------------------------------------------------------------------------------------------
      # Features
      #-----------------------------------------------------------------------------------------------------------------
      CACHE_ENABLED:
        type: boolean
        required: false
        default: false
      CACHE_DEPENDENCY_PATH:
        type: string
        required: false
        default: go.mod
      #-----------------------------------------------------------------------------------------------------------------
      # Platform
      #-----------------------------------------------------------------------------------------------------------------
      OS_VERSION:
        type: string
        required: false
        default: ubuntu-24.04
      GO_VERSION:
        type: string
        required: false
        default: ""
      GO_VERSION_FILE:
        type: string
        required: false
        default: go.mod
      #-----------------------------------------------------------------------------------------------------------------
      # Registry
      #-----------------------------------------------------------------------------------------------------------------
      # No Registry
      #-----------------------------------------------------------------------------------------------------------------
      # Artifact
      #-----------------------------------------------------------------------------------------------------------------
      ARTIFACT_ENABLED:
        type: boolean
        required: false
        default: false
      ARTIFACT_NAME:
        type: string
        required: false
        default: bin
      ARTIFACT_PATH:
        type: string
        required: false
        default: bin
      ARTIFACT_RETENTION:
        type: string
        required: false
        default: "1"
permissions:
  contents: read

jobs:
  #---------------------------------------------------------------------------------------------------------------------
  # Build
  #---------------------------------------------------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ${{ inputs.OS_VERSION }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.WORKING_DIR }}
    steps:
    #-------------------------------------------------------------------------------------------------------------------
    # Prepare Repository
    #-------------------------------------------------------------------------------------------------------------------
    - name: Prepare
      uses: actions/checkout@v7
    #-------------------------------------------------------------------------------------------------------------------
    # Setup Platform
    #-------------------------------------------------------------------------------------------------------------------
    - name: Configure Go
      uses: bayudwiyansatria/.github/actions/configure-go@master
      with:
        go-version: ${{ inputs.GO_VERSION }}
        go-version-file: ${{ inputs.GO_VERSION_FILE }}
        cache: ${{ inputs.CACHE_ENABLED }}
        cache-dependency-path: ${{ inputs.CACHE_DEPENDENCY_PATH }}
    #-------------------------------------------------------------------------------------------------------------------
    # Build Package
    #-------------------------------------------------------------------------------------------------------------------
    - name: Build Go
      run: ${{ inputs.GO_COMMAND }}
    #-------------------------------------------------------------------------------------------------------------------
    # Upload Artifact
    #-------------------------------------------------------------------------------------------------------------------
    - name: Upload Artifact
      if: ${{ inputs.ARTIFACT_ENABLED }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.ARTIFACT_NAME }}
        path: ${{ inputs.ARTIFACT_PATH }}
        retention-days: ${{ inputs.ARTIFACT_RETENTION }}
        if-no-files-found: error
