name: Test Go
on:
  workflow_call:
    inputs:
      #-----------------------------------------------------------------------------------------------------------------
      # Usage
      #-----------------------------------------------------------------------------------------------------------------
      GO_COMMAND:
        type: string
        required: false
        default: go test -race -coverprofile=coverage.out ./...
      #-----------------------------------------------------------------------------------------------------------------
      # Common
      #-----------------------------------------------------------------------------------------------------------------
      WORKING_DIR:
        type: string
        required: false
        default: .
      #-----------------------------------------------------------------------------------------------------------------
      # Features
      #-----------------------------------------------------------------------------------------------------------------
      CACHE_ENABLED:
        type: boolean
        required: false
        default: false
      CACHE_DEPENDENCY_PATH:
        type: string
        required: false
        default: go.mod
      #-----------------------------------------------------------------------------------------------------------------
      # Platform
      #-----------------------------------------------------------------------------------------------------------------
      OS_VERSION:
        type: string
        required: false
        default: ubuntu-24.04
      GO_VERSION:
        type: string
        required: false
        default: ""
      GO_VERSION_FILE:
        type: string
        required: false
        default: go.mod
      #-----------------------------------------------------------------------------------------------------------------
      # Registry
      #-----------------------------------------------------------------------------------------------------------------
      # No Registry
      #-----------------------------------------------------------------------------------------------------------------
      # Artifact
      #-----------------------------------------------------------------------------------------------------------------
      TEST_ARTIFACT_ENABLED:
        type: boolean
        required: false
        default: true
      TEST_ARTIFACT_NAME:
        type: string
        required: false
        default: coverage
      TEST_ARTIFACT_PATH:
        type: string
        required: false
        default: coverage.out
      TEST_ARTIFACT_RETENTION:
        type: string
        required: false
        default: "1"
permissions:
  contents: read

jobs:
  #---------------------------------------------------------------------------------------------------------------------
  # Test
  #---------------------------------------------------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ${{ inputs.OS_VERSION }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.WORKING_DIR }}
    steps:
    #-------------------------------------------------------------------------------------------------------------------
    # Prepare Repository
    #-------------------------------------------------------------------------------------------------------------------
    - name: Prepare
      uses: actions/checkout@v7
    #-------------------------------------------------------------------------------------------------------------------
    # Setup Platform
    #-------------------------------------------------------------------------------------------------------------------
    - name: Configure Go
      uses: bayudwiyansatria/.github/actions/configure-go@master
      with:
        go-version: ${{ inputs.GO_VERSION }}
        go-version-file: ${{ inputs.GO_VERSION_FILE }}
        cache: ${{ inputs.CACHE_ENABLED }}
        cache-dependency-path: ${{ inputs.CACHE_DEPENDENCY_PATH }}
    #-------------------------------------------------------------------------------------------------------------------
    # Format Source
    #-------------------------------------------------------------------------------------------------------------------
    - name: Check Formatting
      run: |
        files=$(git ls-files -- '*.go' | while IFS= read -r file; do
          case "$file" in
            vendor/*|*/vendor/*) continue ;;
          esac
          gofmt -l "$file"
        done)
        if [ -n "$files" ]; then
          printf '%s\n' "$files"
          exit 1
        fi
    #-------------------------------------------------------------------------------------------------------------------
    # Validate Module
    #-------------------------------------------------------------------------------------------------------------------
    - name: Check Module Metadata
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum
        test -z "$(git ls-files --others --exclude-standard -- go.sum)"
    #-------------------------------------------------------------------------------------------------------------------
    # Code Analysis
    #-------------------------------------------------------------------------------------------------------------------
    - name: Vet
      run: go vet ./...
    #-------------------------------------------------------------------------------------------------------------------
    # Run Unit Test
    #-------------------------------------------------------------------------------------------------------------------
    - name: Run Unit Test
      run: ${{ inputs.GO_COMMAND }}
    #-------------------------------------------------------------------------------------------------------------------
    # Upload Artifact
    #-------------------------------------------------------------------------------------------------------------------
    - name: Archive Coverage Result
      if: ${{ inputs.TEST_ARTIFACT_ENABLED }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.TEST_ARTIFACT_NAME }}
        path: ${{ inputs.TEST_ARTIFACT_PATH }}
        retention-days: ${{ inputs.TEST_ARTIFACT_RETENTION }}
        if-no-files-found: error
