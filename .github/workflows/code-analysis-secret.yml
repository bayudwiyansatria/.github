name: Code Analysis with Secret Detection
on:
  workflow_call:
    inputs:
      #-----------------------------------------------------------------------------------------------------------------
      # Usage
      #-----------------------------------------------------------------------------------------------------------------
      SCAN_MODE:
        type: string
        required: false
        default: dir
      SCAN_ARGS:
        type: string
        required: false
        default: ""
      GITLEAKS_CONFIG:
        type: string
        required: false
        default: ""
      #-----------------------------------------------------------------------------------------------------------------
      # Common
      #-----------------------------------------------------------------------------------------------------------------
      WORKING_DIR:
        type: string
        required: false
        default: .
      FETCH_DEPTH:
        type: string
        required: false
        default: "0"
      #-----------------------------------------------------------------------------------------------------------------
      # Features
      #-----------------------------------------------------------------------------------------------------------------
      REDACT_ENABLED:
        type: boolean
        required: false
        default: true
      SARIF_ENABLED:
        type: boolean
        required: false
        default: true
      ARTIFACT_ENABLED:
        type: boolean
        required: false
        default: true
      FAIL_ON_DETECTION:
        type: boolean
        required: false
        default: true
      #-----------------------------------------------------------------------------------------------------------------
      # Platform
      #-----------------------------------------------------------------------------------------------------------------
      OS_VERSION:
        type: string
        required: false
        default: ubuntu-24.04
      GITLEAKS_VERSION:
        type: string
        required: false
        default: latest
      #-----------------------------------------------------------------------------------------------------------------
      # Registry
      #-----------------------------------------------------------------------------------------------------------------
      # No Registry
      #-----------------------------------------------------------------------------------------------------------------
      # Artifact
      #-----------------------------------------------------------------------------------------------------------------
      ARTIFACT_NAME:
        type: string
        required: false
        default: gitleaks
      ARTIFACT_PATH:
        type: string
        required: false
        default: gitleaks.sarif
      ARTIFACT_RETENTION:
        type: string
        required: false
        default: "1"
    secrets:
      #-----------------------------------------------------------------------------------------------------------------
      # Registry
      #-----------------------------------------------------------------------------------------------------------------
      # No Registry
      #-----------------------------------------------------------------------------------------------------------------
      {}
jobs:
  #---------------------------------------------------------------------------------------------------------------------
  # Code Analysis
  #---------------------------------------------------------------------------------------------------------------------
  code-analysis:
    name: Code Analysis
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        os:
        - ${{ inputs.OS_VERSION }}
    steps:
    #-------------------------------------------------------------------------------------------------------------------
    # Prepare Repository
    #-------------------------------------------------------------------------------------------------------------------
    - name: Prepare
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.FETCH_DEPTH }}
    #-------------------------------------------------------------------------------------------------------------------
    # Setup Platform
    #-------------------------------------------------------------------------------------------------------------------
    - name: Setup Gitleaks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITLEAKS_VERSION: ${{ inputs.GITLEAKS_VERSION }}
      run: |
        set -euo pipefail
        version="${GITLEAKS_VERSION}"
        if [ "${version}" = "latest" ]; then
          version="$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name)"
        fi
        version="${version#v}"
        curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin gitleaks
        gitleaks version
    #-------------------------------------------------------------------------------------------------------------------
    # Run Code Analysis
    #-------------------------------------------------------------------------------------------------------------------
    - name: Secret Detection Analysis
      id: analysis
      shell: bash
      working-directory: ${{ inputs.WORKING_DIR }}
      env:
        SCAN_MODE: ${{ inputs.SCAN_MODE }}
        SCAN_ARGS: ${{ inputs.SCAN_ARGS }}
        GITLEAKS_CONFIG: ${{ inputs.GITLEAKS_CONFIG }}
        REPORT_PATH: ${{ inputs.ARTIFACT_PATH }}
        REDACT_ENABLED: ${{ inputs.REDACT_ENABLED }}
      run: |
        set -uo pipefail
        args=("${SCAN_MODE}" "." --no-banner --report-format sarif --report-path "${REPORT_PATH}")
        # Reserve exit code 2 for findings so every other failure surfaces as a tool error.
        args+=(--exit-code 2)
        if [ "${REDACT_ENABLED}" = "true" ]; then
          args+=(--redact)
        fi
        if [ -n "${GITLEAKS_CONFIG}" ]; then
          args+=(--config "${GITLEAKS_CONFIG}")
        fi
        if [ -n "${SCAN_ARGS}" ]; then
          # shellcheck disable=SC2206
          args+=(${SCAN_ARGS})
        fi
        # The default shell runs with -e, disable it to inspect the exit code.
        set +e
        gitleaks "${args[@]}"
        status=$?
        set -e
        case "${status}" in
        0)
          echo "leaks=false" >> "${GITHUB_OUTPUT}"
          ;;
        2)
          echo "leaks=true" >> "${GITHUB_OUTPUT}"
          ;;
        *)
          echo "::error::Gitleaks exited with code ${status}."
          exit "${status}"
          ;;
        esac
    #-------------------------------------------------------------------------------------------------------------------
    # Report Code Analysis
    #-------------------------------------------------------------------------------------------------------------------
    - name: Secret Detection Summary
      if: ${{ always() && steps.analysis.outputs.leaks != '' }}
      shell: bash
      working-directory: ${{ inputs.WORKING_DIR }}
      env:
        REPORT_PATH: ${{ inputs.ARTIFACT_PATH }}
        LEAKS: ${{ steps.analysis.outputs.leaks }}
      run: |
        set -euo pipefail
        {
          echo "## Secret Detection"
          if [ "${LEAKS}" != "true" ]; then
            echo "No secrets detected."
          else
            echo "| Rule | File | Line |"
            echo "| ---- | ---- | ---- |"
            jq -r '.runs[].results[]
              | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) |"' \
              "${REPORT_PATH}"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
    - name: Upload Analysis Result
      if: ${{ always() && inputs.SARIF_ENABLED == true && steps.analysis.outputs.leaks != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.WORKING_DIR }}/${{ inputs.ARTIFACT_PATH }}
        category: secret-detection
    #-------------------------------------------------------------------------------------------------------------------
    # Upload Artifact
    #-------------------------------------------------------------------------------------------------------------------
    - name: Upload Artifact
      if: ${{ always() && inputs.ARTIFACT_ENABLED == true && steps.analysis.outputs.leaks != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.ARTIFACT_NAME }}
        path: ${{ inputs.WORKING_DIR }}/${{ inputs.ARTIFACT_PATH }}
        retention-days: ${{ inputs.ARTIFACT_RETENTION }}
        if-no-files-found: ignore
    #-------------------------------------------------------------------------------------------------------------------
    # Verify Code Analysis
    #-------------------------------------------------------------------------------------------------------------------
    - name: Verify Secret Detection
      if: ${{ always() && steps.analysis.outputs.leaks == 'true' }}
      shell: bash
      env:
        FAIL_ON_DETECTION: ${{ inputs.FAIL_ON_DETECTION }}
      run: |
        set -euo pipefail
        if [ "${FAIL_ON_DETECTION}" = "true" ]; then
          echo "::error::Potential secrets detected. Review the job summary and rotate every exposed credential."
          exit 1
        fi
        echo "::warning::Potential secrets detected. Review the job summary and rotate every exposed credential."
